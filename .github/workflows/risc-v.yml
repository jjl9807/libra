on:
  pull_request:
    paths-ignore:
      - '.github/**'
      - 'docs/**'

name: Check, Build and Test - RISC-V

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  riscv:
      name: Build & Test on RISC-V
      runs-on: ubuntu-24.04-riscv

      steps:
        - name: Checkout
          uses: actions/checkout@v5

        - name: Check architecture
          run: |
            uname -m
            uname -a
            cat /proc/cpuinfo | head -20

        - name: Install Rust
          run: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH

        - name: Show toolchain
          run: |
            rustc --version
            cargo --version

        - name: Setup Node.js
          uses: actions/setup-node@v5
          with:
            node-version: "22"

        - name: Enable pnpm
          run: |
            corepack enable
            corepack prepare pnpm@11.10.0 --activate

        - name: Install web dependencies
          run: pnpm --dir web install --frozen-lockfile

        - name: Lint web
          run: pnpm --dir web lint

        - name: Test web
          run: pnpm --dir web test

        - name: Build web (static export → web/out/)
          run: pnpm --dir web build

        - name: Check web/out static export drift
          shell: bash
          run: |
            status="$(git status --porcelain -- web/out)"
            if [[ -n "$status" ]]; then
              echo "web/out has untracked, staged, or unstaged files after the static export build." >&2
              echo "Run 'pnpm --dir web build' locally and commit the updated web/out files." >&2
              printf '%s\n' "$status" >&2
              exit 1
            fi

        - name: Build
          run: cargo build --release
